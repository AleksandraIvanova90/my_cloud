[django]
SECRET_KEY = ''
DEBUG =true
# Перечисляем разрешенные хосты
ALLOWED_HOSTS = []
SITE_URL = ''

[database]
ENGINE = "django.db.backends.postgresql"
NAME = "c"
USER = ""
PASSWORD = ""
HOST = "127.0.0.1"
PORT = "5432"

[cors]
# Перечисляем разрешенные источники CORS
ALLOWED_ORIGINS = []
ALLOW_CREDENTIALS = true
# Перечисляем заголовки, которые разрешено передавать
ALLOW_HEADERS = [
'accept',
    'accept-encoding',
    'authorization',
    'content-type',
    'dnt',
    'origin',
    'user-agent',
    'x-csrftoken',
    'x-requested-with',
]
# Перечисляем заголовки, которые разрешено выставлять в ответе
EXPOSE_HEADERS = ['content-disposition']

[rest_framework]
DEFAULT_PAGINATION_CLASS = 'rest_framework.pagination.PageNumberPagination'
PAGE_SIZE = 100

[logging.loggers.users]
LEVEL = 'INFO'

[logging.loggers.files]
LEVEL = 'INFO'