[django]
SECRET_KEY = ''
DEBUG = true
# Перечисляем разрешенные хосты
ALLOWED_HOSTS = [
    "localhost",
    "127.0.0.1"
]
SITE_URL = 'http://127.0.0.1:8000'

[database]
ENGINE = "django.db.backends.postgresql"
NAME = ""
USER = ""
PASSWORD = ""
HOST = "127.0.0.1"
PORT = "5432"

[cors]
# Перечисляем разрешенные источники CORS
ALLOWED_ORIGINS = [
    "http://localhost:3000",
    "http://127.0.0.1:3000"
]
ALLOW_CREDENTIALS = true
# Перечисляем заголовки, которые разрешено передавать
ALLOW_HEADERS = [
    'content-type',
    'authorization',
    'content-disposition'
]
# Перечисляем заголовки, которые разрешено выставлять в ответе
EXPOSE_HEADERS = ['content-disposition']

[rest_framework]
DEFAULT_PAGINATION_CLASS = 'rest_framework.pagination.PageNumberPagination'
PAGE_SIZE = 100

[logging.loggers.users]
LEVEL = 'INFO' 

[logging.loggers.files]
LEVEL = 'INFO' 